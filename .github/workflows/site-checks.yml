name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Dependency advisories fail the check; review upgrades rather than forcing fixes.
      - name: Report dependency advisories
        run: npm audit --audit-level=low
      # All checks use this public repository only.
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare preview responses
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]'
        run: node scripts/check-hosted-site.mjs --from-github
        env:
          GH_TOKEN: ${{ github.token }}

